name: Python checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r telemetry_backend/requirements.txt

      - name: Run telemetry storage tests
        env:
          PYTHONPATH: telemetry_backend
        run: python -m unittest discover -s telemetry_backend/tests -v

      - name: Compile Python sources
        run: python -m compileall -q ros2_mqtt_bridge ros2_video_streamer telemetry_backend db_init.py run_demo.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
